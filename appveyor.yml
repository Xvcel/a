version: 1.0.{build}

image: Visual Studio 2022

install:
  - ps: |
      $ProgressPreference = 'SilentlyContinue'
      pip install aqtinstall | Out-Null
      Write-Host "Installing Qt..."
      aqt install-qt windows desktop 6.7.2 win64_msvc2019_64 -O C:\Qt
      Write-Host "Qt installed OK"

build_script:
  - cmd: |
      call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
      set PATH=C:\Qt\6.7.2\msvc2019_64\bin;%PATH%
      cmake -B build -S . -DCMAKE_PREFIX_PATH="C:\Qt\6.7.2\msvc2019_64" -DCMAKE_BUILD_TYPE=Release
      cmake --build build --config Release --parallel 4

after_build:
  - ps: |
      New-Item -ItemType Directory -Force -Path deploy
      Copy-Item "build\Release\WeWords.exe" deploy\
      & "C:\Qt\6.7.2\msvc2019_64\bin\windeployqt.exe" --release --no-translations "deploy\WeWords.exe"
      Compress-Archive -Path "deploy\*" -DestinationPath "WeWords-Windows.zip"
      Write-Host "Package ready"

artifacts:
  - path: WeWords-Windows.zip
    name: WeWords-Windows
